# configs/agent.yaml
# Every numeric value below is a STARTING POINT, not a tuned result.
# Replace each with the value your own runs justify and cite the evidence
# (curve / ablation) next to it in the report.
project: "Drone swarm SAR - MAPPO tactical policy"
seed: 0

env:                    # Dec-POMDP stand-in for the Task 1 disaster zone
  size: 10              # grid is size x size
  n_drones: 3
  n_victims: 4
  obstacle_density: 0.12
  patch: 5              # local observation window (odd): k x k cells
  max_steps: 120
  battery_max: 60.0
  cost_move: 1.0
  cost_verify: 2.0
  cost_hold: 0.2
  recharge: 10.0        # battery gained per step spent at base
  sensor_radius: 1      # passive Bayesian scan radius (Chebyshev)
  pd: 0.80              # passive detection prob.  P(z=1 | victim)
  pf: 0.05              # passive false-alarm prob. P(z=1 | no victim)
  pd_verify: 0.95       # verify action: high-accuracy scan of own cell
  pf_verify: 0.02
  prior: 0.06           # initial P(H) per free cell
  confirm_p: 0.90       # posterior needed to confirm a victim
  waste_p: 0.05         # verifying below this belief counts as wasteful
  sigma_growth: 0.04    # position-uncertainty growth per move (normalised 0..1)
  comm_radius: 6.0
  goal_refresh: 8       # allocator stub re-plans every N steps

reward:                 # justify every term in the report
  find: 10.0            # newly confirmed victim
  info: 0.5             # per nat of belief-entropy reduction
  step: -0.02           # per alive drone per step (discourages dithering)
  collision: -0.5       # blocked move
  false_pos: -2.0       # confirmed a victim that is not there
  waste: -0.3           # wasteful verify
  dead: -5.0            # battery exhausted away from base
  overlap: -0.1         # two drones in the same non-base cell
  veto: -0.2            # safety filter had to veto the policy
  return: 1.0           # per drone at base when the episode ends

safety:                 # fuzzy safety filter (rules documented in safety.py)
  margin_lo: 0.0        # battery margin (fraction of battery_max)
  margin_hi: 0.25
  sigma_lo: 0.3
  sigma_hi: 0.7
  attenuate_threshold: 0.4
  veto_threshold: 0.8
  repeat_limit: 6       # loop-trap guard window

mappo:
  hidden: 64
  learning_rate: 5.0e-4
  critic_lr_scale: 1.0
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ppo_epochs: 5
  minibatch_size: 64    # (episode, step) samples per gradient step
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 10.0
  value_clip: true            # set false to test the critic-clipping hypothesis
  critic: central             # central = MAPPO (global-state critic); local = IPPO ablation

train:
  n_updates: 200
  episodes_per_update: 8
  train_layout_seeds: 12      # fixed pool -> overfitting risk is measurable
  heldout_layout_seeds: 12    # never seen in training
  noise_inject: 0.5           # train-time sensor-noise scale ~ U[1, 1+x]
  eval_every: 10
  eval_episodes: 12

eval:
  episodes: 30
  shifted_noise: 2.0          # unseen sensor-noise level (reality-gap test)

xai:
  horizon: 5                  # steps of look-ahead shown to the supervisor
  confidence_threshold: 0.45  # below this the plan needs human review
  risk_threshold: 0.4         # filter risk at/above this needs human review
  challenge_rate: 0.15        # share of reviews that are deliberate decoys
  supervisor_attention: 0.7   # simulated P(supervisor really scrutinises)

logging:
  run_dir: "runs/exp1"      # override with --run_dir
  level: "INFO"

deployment:             # assumptions for the report's deployment discussion (state them as assumptions)
  target: "onboard CPU, single thread, one shared actor evaluated for all drones in one batch"
  decision_period_s: 1.0      # assumed tactical decision period (one grid step)
  latency_budget_ms: 50       # assumed budget for policy inference; deploy.py measures against it
  cpu_threads: 1
  bench_calls: 1000
  fallback: heuristic         # learned policy exception/non-finite logits -> rule-based controller (evaluation only)

experiments:            # experiments.py: evidence for hyperparameter / design rationale
  updates: 100                # PPO updates per variant (set to what your hardware budget allows)
  seeds: [0, 1, 2]
  eval_episodes: 30
  lr: [1.0e-4, 5.0e-4, 2.0e-3]
  ppo_epochs: [2, 5, 10]
  minibatch_size: [32, 64, 256]
  gamma: [0.9, 0.99]
  layout_pool: [1, 3, 12, 48]        # training-layout pool size -> overfitting evidence
  reward_ablate: [info, collision, step, veto, overlap]   # each term set to 0 in turn
  forgetting:
    env_b_obstacle_density: 0.25     # task B: much denser rubble than task A (0.12)
    phase_a_updates: 100
    phase_b_updates: 60
    replay_fraction: 0.5             # share of phase-B episodes drawn from task A (mitigation)
  attention: [0.0, 0.3, 0.5, 0.7, 0.9, 1.0]   # simulated supervisor scrutiny levels
